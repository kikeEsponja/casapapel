<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/casapapel.css">
    <title>Prácticas</title>
    <style>
        body {
            background-image: url('./img/fondo.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        main {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            color: white;
        }
        .video-container {
            width: 90%;
            height: auto;
        }
        video {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }
    </style>
</head>
<body class="index">
    <center>
        <main>
            <div class="video-container">
                <video src="./video2248499616.mp4" autoplay controls></video>
            </div>
            
            <button id="volver">Volver</button>
        </main>
        <footer>
            <p>&copy; 2021 Prologic</p>
            <p>Desarrollado por KikeEsponja</p>
        </footer>
    </center>
    <script>
        let boton = document.getElementById("volver");
        boton.addEventListener("click", function() {
            window.history.back();
        });
    </script>
</body>
</html>
